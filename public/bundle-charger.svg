<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="32" fill="#f8fafc"/>
  <!-- Wall Adapter Main Body -->
  <rect x="55" y="45" width="55" height="65" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Wall Prongs -->
  <rect x="70" y="25" width="8" height="20" rx="3" fill="#cbd5e1"/>
  <rect x="87" y="25" width="8" height="20" rx="3" fill="#cbd5e1"/>
  <!-- USB-C / USB Port on adapter -->
  <rect x="72" y="96" width="20" height="6" rx="3" fill="#94a3b8"/>
  <rect x="75" y="98" width="14" height="2" rx="1" fill="#64748b"/>
  <!-- Cable -->
  <path d="M 82 102 C 82 145, 120 155, 135 130 C 145 110, 125 90, 140 75 C 150 65, 160 80, 155 100" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>
  <path d="M 82 102 C 82 145, 120 155, 135 130 C 145 110, 125 90, 140 75 C 150 65, 160 80, 155 100" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 82 102 C 82 145, 120 155, 135 130 C 145 110, 125 90, 140 75 C 150 65, 160 80, 155 100" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4"/>
  <!-- Cable Connector Head -->
  <rect x="148" y="98" width="14" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-20 148 98)"/>
  <rect x="153" y="118" width="6" height="8" rx="2" fill="#94a3b8" transform="rotate(-20 153 118)"/>
</svg>
