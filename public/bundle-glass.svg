<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="32" fill="#f8fafc"/>
  <!-- Tempered Glass Screen Outline -->
  <rect x="52" y="24" width="96" height="152" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Inner Glass Layer with Light Blue Reflection -->
  <rect x="55" y="27" width="90" height="146" rx="15" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Speaker Notch Cutout -->
  <rect x="84" y="32" width="32" height="6" rx="3" fill="#64748b"/>
  <!-- Diagonal Glare Highlight -->
  <path d="M 60 40 L 125 160 L 140 160 L 75 40 Z" fill="#ffffff" fill-opacity="0.45"/>
  <!-- 9H Hardness Badge -->
  <rect x="62" y="142" width="30" height="16" rx="4" fill="#0f172a"/>
  <text x="77" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">9H</text>
  <defs>
    <linearGradient id="glassGrad" x1="55" y1="27" x2="145" y2="173" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
</svg>
